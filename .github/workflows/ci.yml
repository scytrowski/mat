name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test supported Scala versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          # renovate: datasource=java-version depName=java-jdk
          java-version: 25

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/**', '.scalafmt.conf') }}

      - name: Check formatting
        run: sbt --batch scalafmtCheckAll

      - name: Run tests
        run: sbt --batch +test

      - name: Coverage
        run: sbt --batch coverage test coverageReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/scala-3.8.4/coverage-report

      - name: Package
        run: sbt --batch +package
