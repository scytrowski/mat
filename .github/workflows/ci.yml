name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 24

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/**', '.scalafmt.conf') }}

      - name: Check formatting
        run: sbt --batch scalafmtCheckAll

      - name: Run tests
        run: sbt --batch test

      - name: Package
        run: sbt --batch package
