name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to process
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release package
    runs-on: ubuntu-latest

    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          # renovate: datasource=java-version depName=java-jdk
          java-version: 25

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run compile-time benchmarks
        run: bash scripts/benchmark.sh benchmark-results.tsv

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-time-benchmark-${{ github.event.release.tag_name || inputs.release_tag }}
          path: benchmark-results.tsv
          if-no-files-found: error

      - name: Load previous benchmark baseline
        id: benchmark-baseline
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          if git fetch origin benchmarks:refs/remotes/origin/benchmarks 2>/dev/null \
            && baseline_tag=$(git ls-tree --name-only origin/benchmarks \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' \
              | sort -V \
              | awk -v current="$RELEASE_TAG" '$0 == current { exit } { previous = $0 } END { print previous }') \
            && [[ -n "$baseline_tag" ]] \
            && git show "origin/benchmarks:$baseline_tag/results.tsv" > benchmark-baseline.tsv 2>/dev/null; then
            echo "Using benchmark baseline from $baseline_tag."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No previous benchmark baseline found; this release establishes it."
          fi

      - name: Check benchmark regression
        if: steps.benchmark-baseline.outputs.available == 'true'
        run: bash scripts/compare-benchmarks.sh benchmark-results.tsv benchmark-baseline.tsv

      - name: Import GPG key
        run: |
          echo "$PGP_SECRET" | base64 --decode | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Verify release environment
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail

          for variable in PGP_PASSPHRASE PGP_SECRET SONATYPE_USERNAME SONATYPE_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required release secret $variable is missing or empty."
              exit 1
            fi
          done

          if ! git rev-parse --verify "$RELEASE_TAG^{commit}" >/dev/null 2>&1; then
            echo "::error::Release tag $RELEASE_TAG does not exist."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME:-}" == "release" ]]; then
            expected_ref="refs/tags/$RELEASE_TAG"
            if [[ "${GITHUB_REF:-}" != "$expected_ref" ]]; then
              echo "::error::Release must run from $expected_ref, got ${GITHUB_REF:-<unset>}."
              exit 1
            fi
          fi

      - name: Publish to Sonatype
        shell: bash
        run: |
          set -euo pipefail

          release_log=$(mktemp)
          trap 'rm -f "$release_log"' EXIT

          sbt --server --batch ci-release 2>&1 | tee "$release_log"

          if grep -Fq "doing nothing" "$release_log"; then
            echo "::error::sbt-ci-release skipped publication."
            exit 1
          fi
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Generate Scaladoc with local assets
        run: sbt --server --batch ';++3.8.4;vendorScaladocAssets'

      - name: Update Scaladoc artifact branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          if git fetch origin scaladoc:refs/remotes/origin/scaladoc; then
            has_scaladoc_branch=true
          else
            has_scaladoc_branch=false
          fi

          publish_dir=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$publish_dir"
          }
          trap cleanup EXIT

          if [[ "$has_scaladoc_branch" == true ]]; then
            git worktree add --detach "$publish_dir" refs/remotes/origin/scaladoc
            git -C "$publish_dir" switch -C scaladoc refs/remotes/origin/scaladoc
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan scaladoc
            git -C "$publish_dir" clean -fdx
          fi

          rm -rf "$publish_dir/$RELEASE_TAG" "$publish_dir/latest"
          mkdir -p "$publish_dir/$RELEASE_TAG"
          cp -a target/out/jvm/scala-3.8.4/mat/api/. "$publish_dir/$RELEASE_TAG/"

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          git -C "$publish_dir" commit -m "Publish Scaladoc for $RELEASE_TAG"
          git -C "$publish_dir" push origin HEAD:scaladoc

      - name: Prepare benchmark history
        run: |
          mkdir -p benchmark-publish
          cp benchmark-results.tsv benchmark-publish/results.tsv

      - name: Update benchmark artifact branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail

          if git fetch origin benchmarks:refs/remotes/origin/benchmarks; then
            has_benchmarks_branch=true
          else
            has_benchmarks_branch=false
          fi

          publish_dir=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$publish_dir"
          }
          trap cleanup EXIT

          if [[ "$has_benchmarks_branch" == true ]]; then
            git worktree add --detach "$publish_dir" refs/remotes/origin/benchmarks
            git -C "$publish_dir" switch -C benchmarks refs/remotes/origin/benchmarks
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan benchmarks
            git -C "$publish_dir" clean -fdx
          fi

          rm -rf "$publish_dir/$RELEASE_TAG" "$publish_dir/latest"
          mkdir -p "$publish_dir/$RELEASE_TAG" "$publish_dir/latest"
          cp -a benchmark-publish/. "$publish_dir/$RELEASE_TAG/"
          cp -a benchmark-publish/. "$publish_dir/latest/"

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          git -C "$publish_dir" commit -m "Publish benchmark report for $RELEASE_TAG"
          git -C "$publish_dir" push origin HEAD:benchmarks
