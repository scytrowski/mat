name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Release package
    runs-on: ubuntu-latest

    if: startsWith(github.event.release.tag_name, 'v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 24

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Import GPG key
        run: |
          echo "$PGP_SECRET" | base64 --decode | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Publish to Sonatype
        run: sbt --batch ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Generate Scaladoc
        run: sbt --batch doc

      - name: Publish versioned Scaladoc
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: scaladoc
          publish_dir: ./target/scala-3.8.4/api
          destination_dir: ${{ github.event.release.tag_name }}
          commit_message: "Publish Scaladoc for ${{ github.event.release.tag_name }}"

      - name: Publish latest Scaladoc
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: scaladoc
          publish_dir: ./target/scala-3.8.4/api
          destination_dir: latest
          commit_message: "Update latest Scaladoc for ${{ github.event.release.tag_name }}"
