name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Release package
    runs-on: ubuntu-latest

    if: startsWith(github.event.release.tag_name, 'v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          # renovate: datasource=java-version depName=java-jdk
          java-version: 25

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Run compile-time benchmarks
        run: bash scripts/benchmark.sh benchmark-results.tsv

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-time-benchmark-${{ github.event.release.tag_name }}
          path: benchmark-results.tsv
          if-no-files-found: error

      - name: Load previous benchmark baseline
        id: benchmark-baseline
        shell: bash
        run: |
          if git fetch origin benchmarks:refs/remotes/origin/benchmarks 2>/dev/null \
            && git show origin/benchmarks:latest/results.tsv > benchmark-baseline.tsv 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No previous benchmark baseline found; this release establishes it."
          fi

      - name: Check benchmark regression
        if: steps.benchmark-baseline.outputs.available == 'true'
        run: bash scripts/compare-benchmarks.sh benchmark-results.tsv benchmark-baseline.tsv

      - name: Import GPG key
        run: |
          echo "$PGP_SECRET" | base64 --decode | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Publish to Sonatype
        run: sbt --batch ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Generate Scaladoc with local assets
        run: sbt --batch ++3.8.4 vendorScaladocAssets

      - name: Update Scaladoc artifact branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if git fetch origin scaladoc:refs/remotes/origin/scaladoc; then
            has_scaladoc_branch=true
          else
            has_scaladoc_branch=false
          fi

          publish_dir=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$publish_dir"
          }
          trap cleanup EXIT

          if [[ "$has_scaladoc_branch" == true ]]; then
            git worktree add --detach "$publish_dir" refs/remotes/origin/scaladoc
            git -C "$publish_dir" switch -C scaladoc refs/remotes/origin/scaladoc
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan scaladoc
            git -C "$publish_dir" clean -fdx
          fi

          rm -rf "$publish_dir/$RELEASE_TAG" "$publish_dir/latest"
          mkdir -p "$publish_dir/$RELEASE_TAG"
          cp -a target/out/jvm/scala-3.8.4/mat/api/. "$publish_dir/$RELEASE_TAG/"

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          git -C "$publish_dir" commit -m "Publish Scaladoc for $RELEASE_TAG"
          git -C "$publish_dir" push origin HEAD:scaladoc

      - name: Prepare benchmark history
        run: |
          mkdir -p benchmark-publish
          cp benchmark-results.tsv benchmark-publish/results.tsv

      - name: Update benchmark artifact branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          if git fetch origin benchmarks:refs/remotes/origin/benchmarks; then
            has_benchmarks_branch=true
          else
            has_benchmarks_branch=false
          fi

          publish_dir=$(mktemp -d)
          cleanup() {
            git worktree remove --force "$publish_dir"
          }
          trap cleanup EXIT

          if [[ "$has_benchmarks_branch" == true ]]; then
            git worktree add --detach "$publish_dir" refs/remotes/origin/benchmarks
            git -C "$publish_dir" switch -C benchmarks refs/remotes/origin/benchmarks
          else
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan benchmarks
            git -C "$publish_dir" clean -fdx
          fi

          rm -rf "$publish_dir/$RELEASE_TAG" "$publish_dir/latest"
          mkdir -p "$publish_dir/$RELEASE_TAG" "$publish_dir/latest"
          cp -a benchmark-publish/. "$publish_dir/$RELEASE_TAG/"
          cp -a benchmark-publish/. "$publish_dir/latest/"

          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          git -C "$publish_dir" commit -m "Publish benchmark report for $RELEASE_TAG"
          git -C "$publish_dir" push origin HEAD:benchmarks
